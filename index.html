<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEKO STORE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #10131c;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(16, 19, 28, 0.5);
            z-index: -1;
        }

        /* Шапка */
        header {
            background: rgba(27, 32, 48, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0; z-index: 50;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        
        .logo-area { display: flex; align-items: center; gap: 15px; }
        header h1 { color: #5795ff; font-size: 26px; letter-spacing: 1px; }
        
        #admin-indicator {
            display: none; align-items: center; gap: 10px;
            color: #4caf50; font-size: 14px;
            background: rgba(76, 175, 80, 0.1); padding: 5px 10px;
            border-radius: 8px; border: 1px solid #4caf50;
        }

        #logout-btn {
            background: #f44336; color: white; border: none; padding: 3px 8px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; transition: 0.2s;
        }
        #logout-btn:hover { background: #d32f2f; }

        /* Навигация */
        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a { color: #d0d6e2; text-decoration: none; font-size: 16px; transition: color 0.2s; }
        nav a:hover { color: #5795ff; }
        
        #cart-btn { 
            background: rgba(37, 43, 61, 0.8); padding: 8px 16px; border-radius: 20px;
            border: 1px solid #5795ff; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 16px;
        }
        #cart-btn:hover { background: #5795ff; color: #10131c; }

        /* Кнопка добавления товара В ШАПКЕ */
        #add-product-btn {
            display: none;
            padding: 8px 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
            transition: 0.2s;
        }
        #add-product-btn:hover { background: #388e3c; transform: scale(1.05); }

        /* Основной контент */
        main {
            flex: 1; padding: 40px 20px 80px; text-align: center;
            max-width: 1100px; margin: 0 auto; width: 100%;
        }

        main > h2 { font-size: 34px; margin-bottom: 12px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        main > p { color: #b7bfd0; font-size: 18px; margin-bottom: 40px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        
        /* Сетка товаров */
        #products {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px; margin-top: 20px;
        }
        #products > h2 { grid-column: 1 / -1; font-size: 28px; margin-bottom: 20px; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        
        .product {
            background: rgba(35, 40, 58, 0.9);
            backdrop-filter: blur(5px); padding: 20px 20px 35px 20px; border-radius: 16px;
            border: 1px solid #2f3a55; transition: transform 0.2s, border-color 0.2s;
            display: flex; flex-direction: column; justify-content: space-between;
            position: relative;
        }
        .product:hover { transform: translateY(-6px); border-color: #5795ff; box-shadow: 0 10px 30px rgba(87, 149, 255, 0.3); }
        
        /* Картинка карточки */
        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #1b2030;
            border: 1px solid #2f3a55;
        }

        .product h3 { font-size: 18px; margin-bottom: 10px; line-height: 1.3; }
        .price { color: #5795ff; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
        
        .buy-button {
            padding: 12px 24px; background: #5795ff; color: white; border: none;
            border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .buy-button:hover { background: #3d7ae0; }

        /* Кнопки админа на карточках */
        .admin-controls { display: none; position: absolute; top: 10px; right: 10px; gap: 5px; z-index: 2; }
        .admin-controls button { background: #f44336; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .admin-controls button.edit-btn { background: #4caf50; }

        /* Окна */
        .cart-modal, .admin-login-modal, .add-product-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); z-index: 100;
            justify-content: center; align-items: center;
        }
        .cart-modal.active, .admin-login-modal.active, .add-product-modal.active { display: flex; }
        
        .modal-content {
            background: #1b2030; width: 90%; max-width: 450px; border-radius: 16px;
            border: 1px solid #5795ff; padding: 25px; position: relative; text-align: center;
        }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #b7bfd0; background: none; border: none; }
        .modal-content h2 { margin-bottom: 20px; color: #5795ff; }
        
        /* Поля ввода */
        .modal-content input {
            width: 100%; padding: 12px; background: #10131c; border: 1px solid #2f3a55;
            color: white; border-radius: 10px; font-size: 16px; margin-bottom: 15px; text-align: center;
        }
        
        .admin-submit-btn {
            width: 100%; padding: 12px; background: #4caf50; color: white; border: none;
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;
        }
        .admin-submit-btn:hover { background: #388e3c; }

        /* Корзина */
        #cart-list { list-style: none; max-height: 300px; overflow-y: auto; margin-bottom: 20px; border-top: 1px solid #2f3a55; border-bottom: 1px solid #2f3a55; padding: 10px 0; text-align: left; }
        #cart-list li { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(47, 58, 85, 0.5); }
        .cart-total { text-align: right; font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .cart-actions { display: flex; flex-direction: column; gap: 10px; }
        .clear-btn { padding: 12px; background: #f44336; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; }
        .checkout-btn { 
            display: block; text-align: center; text-decoration: none;
            padding: 15px; background: #0088cc; color: white; border: none; 
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;
        }
        .checkout-btn:hover { background: #0077b3; }

        /* Секретная кнопка */
        #secret-admin-btn {
            position: fixed; bottom: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(27, 32, 48, 0.5); border: 1px solid rgba(87, 149, 255, 0.3);
            border-radius: 50%; cursor: pointer; z-index: 99;
            display: flex; justify-content: center; align-items: center;
            color: rgba(255,255,255,0.1); font-size: 20px; transition: 0.3s;
        }
        #secret-admin-btn:hover { background: #5795ff; color: white; transform: rotate(90deg); }

        /* Футер */
        footer { background: rgba(27, 32, 48, 0.9); padding: 30px 20px; text-align: center; border-top: 1px solid #2f3a55; margin-top: auto; }
        footer p { color: #b7bfd0; font-size: 15px; margin-bottom: 15px; }
        .social-links { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .social-links a {
            display: flex; align-items: center; justify-content: center;
            width: 50px; height: 50px; background: rgba(27, 32, 48, 0.8);
            color: #d0d6e2; text-decoration: none; border-radius: 14px;
            font-weight: bold; font-size: 16px; border: 1px solid #2f3a55;
        }
        .social-links a:hover { background: #5795ff; color: white; }

        @media (max-width: 800px) {
            header { flex-direction: column; gap: 15px; }
            nav { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1>NEKO STORE</h1>
            <span id="admin-indicator">
                (ADMIN)
                <button id="logout-btn">Выйти</button>
            </span>
        </div>
        <nav>
            <button id="add-product-btn">+ Добавить товар</button>
            <a href="#">Главная</a>
            <a href="#">Каталог</a>
            <button id="cart-btn">Корзина 🛒 (<span id="cart-count">0</span>)</button>
        </nav>
    </header>

    <main>
        <h2>Добро пожаловать в NEKO STORE!</h2>
        <p>Лучшие товары по отличным ценам.</p>

        <section id="products">
            <h2>Наши товары</h2>
        </section>
    </main>

    <div id="secret-admin-btn" title="Вход для админа">⚙</div>

    <!-- Окно входа в админку -->
    <div class="admin-login-modal" id="admin-login-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-admin-login">&times;</button>
            <h2>Вход для админа</h2>
            <input type="password" id="admin-password" placeholder="Введите пароль...">
            <button class="admin-submit-btn" id="login-submit">Войти</button>
        </div>
    </div>

    <!-- Окно добавления товара -->
    <div class="add-product-modal" id="add-product-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-add-product">&times;</button>
            <h2>Добавить товар</h2>
            <input type="text" id="new-product-name" placeholder="Название (например: 🇷🇺 Номер +7)">
            <input type="number" id="new-product-price" placeholder="Цена (в рублях)">
            <input type="text" id="new-product-image" placeholder="Ссылка на фото (или имя файла)">
            <button class="admin-submit-btn" id="save-new-product">Сохранить товар</button>
        </div>
    </div>

    <!-- Корзина -->
    <div class="cart-modal" id="cart-modal">
        <div class="modal-content">
            <button class="close-btn" id="close-cart">&times;</button>
            <h2>Твоя корзина</h2>
            <ul id="cart-list"></ul>
            <div class="cart-total">Итого: <span id="cart-total-price">0</span> ₽</div>
            <div class="cart-actions">
                <button class="clear-btn" id="clear-cart">Очистить корзину</button>
                <a href="#" id="tg-checkout-link" class="checkout-btn" target="_blank">Заказать в Telegram</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 NEKO STORE. Мои соцсети:</p>
        <div class="social-links">
            <a href="https://t.me/uygix" target="_blank">TG</a>
            <a href="#" target="_blank">VK</a>
            <a href="#" target="_blank">YT</a>
            <a href="#" target="_blank">DS</a>
        </div>
    </footer>

    <script>
        const telegramUsername = "uygix"; 
        const ADMIN_PASSWORD = "0811"; 
        
        let isAdmin = false;

        const defaultProducts = [
            { name: "🇰🇿 Номер +7 (Казахстан)", price: 350, image: "https://images.unsplash.com/photo-1557672172-298e090bd0f1?auto=format&fit=crop&w=400&q=80" },
            { name: "🇺🇸 Номер +1 (США/Канада)", price: 99, image: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29?auto=format&fit=crop&w=400&q=80" },
            { name: "🇧🇩 Номер +880 (Бангладеш)", price: 99, image: "https://images.unsplash.com/photo-1534008757030-27299c4371b6?auto=format&fit=crop&w=400&q=80" },
            { name: "🇨🇴 Номер +57 (Колумбия)", price: 110, image: "https://images.unsplash.com/photo-1583537421433-5203cbfb7b69?auto=format&fit=crop&w=400&q=80" },
            { name: "🇲🇲 Номер +95 (Мьянма)", price: 130, image: "https://images.unsplash.com/photo-1543092555-02613ba0a33c?auto=format&fit=crop&w=400&q=80" },
            { name: "🇵🇱 Номер +48 (Польша)", price: 300, image: "https://images.unsplash.com/photo-1519197924294-4ba991a11128?auto=format&fit=crop&w=400&q=80" },
            { name: "🇺🇿 Номер +998 (Узбекистан)", price: 250, image: "https://images.unsplash.com/photo-1596246807453-413c7dc0e5c4?auto=format&fit=crop&w=400&q=80" },
            { name: "🇮🇳 Номер +91 (Индия)", price: 150, image: "https://images.unsplash.com/photo-1524492412937-b28074a5d7da?auto=format&fit=crop&w=400&q=80" },
            { name: "🇲🇾 Номер +67 (Малайзия)", price: 250, image: "https://images.unsplash.com/photo-1596422846543-75c6fc197f07?auto=format&fit=crop&w=400&q=80" },
            { name: "🇧🇾 Номер +375 (Беларусь)", price: 850, image: "https://images.unsplash.com/photo-1561542320-9a18cd340469?auto=format&fit=crop&w=400&q=80" },
            { name: "🇺🇦 Номер +380 (Украина)", price: 400, image: "https://images.unsplash.com/photo-1561542320-9a18cd340469?auto=format&fit=crop&w=400&q=80" },
            { name: "🇫🇷 Номер +33 (Франция)", price: 300, image: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=400&q=80" },
            { name: "🇯🇵 Номер +81 (Япония)", price: 250, image: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=400&q=80" }
        ];

        let products = JSON.parse(localStorage.getItem('neko_products')) || defaultProducts;

        function saveProducts() {
            localStorage.setItem('neko_products', JSON.stringify(products));
        }

        const productsContainer = document.getElementById("products");
        const addProductBtn = document.getElementById("add-product-btn");
        const adminIndicator = document.getElementById("admin-indicator");
        const logoutBtn = document.getElementById("logout-btn");

        function renderProducts() {
            productsContainer.innerHTML = "<h2>Наши товары</h2>";

            products.forEach((product, index) => {
                const div = document.createElement("div");
                div.className = "product";
                
                const imgSrc = product.image || "https://via.placeholder.com/400x300/1b2030/5795ff?text=NEKO+STORE";

                div.innerHTML = `
                    ${isAdmin ? `
                    <div class="admin-controls" style="display: flex;">
                        <button class="edit-btn" onclick="editProduct(${index})">✎</button>
                        <button class="del-btn" onclick="deleteProduct(${index})">✕</button>
                    </div>` : ''}
                    
                    <img src="${imgSrc}" alt="${product.name}" class="product-img">
                    <h3>${product.name}</h3>
                    <p class="price">${product.price} ₽</p>
                    <button class="buy-button" data-name="${product.name}" data-price="${product.price}">Купить</button>
                `;
                productsContainer.appendChild(div);
            });

            addProductBtn.style.display = isAdmin ? "block" : "none";
            adminIndicator.style.display = isAdmin ? "flex" : "none";
            
            attachBuyEvents();
        }

        logoutBtn.addEventListener("click", () => {
            isAdmin = false;
            renderProducts();
        });

        window.deleteProduct = function(index) {
            if(confirm("Удалить этот товар?")) {
                products.splice(index, 1);
                saveProducts();
                renderProducts();
            }
        };

        window.editProduct = function(index) {
            let newPrice = prompt("Введите новую цену для " + products[index].name, products[index].price);
            if (newPrice !== null && newPrice !== "") {
                products[index].price = Number(newPrice);
                saveProducts();
                renderProducts();
            }
        };

        // Добавление товара
        const addProductModal = document.getElementById("add-product-modal");
        const closeAddProduct = document.getElementById("close-add-product");
        const newProductName = document.getElementById("new-product-name");
        const newProductPrice = document.getElementById("new-product-price");
        const newProductImage = document.getElementById("new-product-image"); 
        const saveNewProduct = document.getElementById("save-new-product");

        addProductBtn.addEventListener("click", () => {
            addProductModal.classList.add("active");
            newProductName.focus();
        });

        closeAddProduct.addEventListener("click", () => {
            addProductModal.classList.remove("active");
            newProductName.value = "";
            newProductPrice.value = "";
            newProductImage.value = "";
        });

        saveNewProduct.addEventListener("click", () => {
            const name = newProductName.value.trim();
            const price = Number(newProductPrice.value);
            const image = newProductImage.value.trim(); 

            if (name === "" || price <= 0 || isNaN(price)) {
                alert("Пожалуйста, заполните название и укажите правильную цену!");
                return;
            }

            products.push({ name: name, price: price, image: image });
            saveProducts();
            renderProducts();

            newProductName.value = "";
            newProductPrice.value = "";
            newProductImage.value = "";
            addProductModal.classList.remove("active");
        });

        // Вход в админку
        const secretBtn = document.getElementById("secret-admin-btn");
        const loginModal = document.getElementById("admin-login-modal");
        const closeLoginBtn = document.getElementById("close-admin-login");
        const loginSubmit = document.getElementById("login-submit");
        const passwordInput = document.getElementById("admin-password");

        secretBtn.addEventListener("click", () => {
            loginModal.classList.add("active");
            passwordInput.focus();
        });

        closeLoginBtn.addEventListener("click", () => {
            loginModal.classList.remove("active");
            passwordInput.value = "";
        });

        loginSubmit.addEventListener("click", () => {
            if (passwordInput.value === ADMIN_PASSWORD) {
                isAdmin = true;
                renderProducts();
                loginModal.classList.remove("active");
                passwordInput.value = "";
            } else {
                alert("Неверный пароль!");
                passwordInput.value = "";
            }
        });

        passwordInput.addEventListener("keypress", function(e) {
            if (e.key === "Enter") loginSubmit.click();
        });

        // Корзина
        let cart = [];
        const cartBtn = document.getElementById("cart-btn");
        const cartModal = document.getElementById("cart-modal");
        const closeCartBtn = document.getElementById("close-cart");
        const cartList = document.getElementById("cart-list");
        const cartCountElement = document.getElementById("cart-count");
        const cartTotalPrice = document.getElementById("cart-total-price");
        const clearCartBtn = document.getElementById("clear-cart");
        const tgCheckoutLink = document.getElementById("tg-checkout-link");

        function updateCartUI() {
            cartCountElement.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartList.innerHTML = "";

            if (cart.length === 0) {
                cartList.innerHTML = "<li style='color: #888; justify-content: center;'>Корзина пуста</li>";
                cartTotalPrice.textContent = "0";
                tgCheckoutLink.style.display = "none"; 
                return;
            }

            tgCheckoutLink.style.display = "block"; 
            let total = 0;

            cart.forEach((item, index) => {
                const li = document.createElement("li");
                li.innerHTML = `
                    <span>${item.name} × ${item.quantity}</span>
                    <span>
                        ${item.price * item.quantity} ₽
                        <button class="remove-item" data-index="${index}" style="background:none; border:none; color:#f44336; cursor:pointer; margin-left: 10px; font-weight:bold; font-size: 16px;">✕</button>
                    </span>
                `;
                cartList.appendChild(li);
                total += item.price * item.quantity;
            });

            cartTotalPrice.textContent = total;

            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    cart.splice(Number(this.dataset.index), 1);
                    updateCartUI();
                });
            });
        }

        function attachBuyEvents() {
            const buyButtons = document.querySelectorAll(".buy-button");
            buyButtons.forEach(function (button) {
                button.addEventListener("click", function () {
                    const name = button.dataset.name;
                    const price = Number(button.dataset.price);
                    const existingItem = cart.find(item => item.name === name);
                    
                    if (existingItem) { existingItem.quantity += 1; } 
                    else { cart.push({ name: name, price: price, quantity: 1 }); }
                    updateCartUI();
                });
            });
        }

        cartBtn.addEventListener("click", () => cartModal.classList.add("active"));
        closeCartBtn.addEventListener("click", () => cartModal.classList.remove("active"));
        cartModal.addEventListener("click", (e) => { if (e.target === cartModal) cartModal.classList.remove("active"); });
        clearCartBtn.addEventListener("click", () => { cart = []; updateCartUI(); });

        tgCheckoutLink.addEventListener("click", function (e) {
            if (cart.length === 0) { e.preventDefault(); return; }

            let namesArray = cart.map(item => item.name);
            let message = namesArray.length === 1 
                ? `Привет! Я по поводу ${namesArray[0]}` 
                : `Привет! Я по поводу ${namesArray.join(', ')}`;

            this.href = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
            
            setTimeout(() => {
                cart = [];
                updateCartUI();
                cartModal.classList.remove("active");
            }, 100);
        });

        renderProducts();
    </script>
</body>
</html>
